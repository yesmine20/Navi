[project]
name = "navi-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "supabase>=2.9",
    "pyjwt>=2.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-mistralai>=0.2",
    "mcp>=1.2",
]

[tool.setuptools.packages.find]
include = ["app*", "mcp_servers*"]
